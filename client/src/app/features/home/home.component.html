<section class="auctions">
  <header class="auctions-head">
    <h1>Subastas en curso</h1>
    <p class="subtitle">Explora los productos disponibles y su puja inicial.</p>
  </header>

  <form class="my-bids" (submit)="onSearchMyBids($event)">
    <label for="myPhone">¿Ya has pujado? Consulta tus pujas con tu número de teléfono</label>
    <div class="my-bids-row">
      <input
        #myPhoneInput
        id="myPhone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="+34 600 000 000"
      />
      <button type="submit">Ver mis pujas</button>
    </div>
    @if (myBidsError()) {
      <p class="error">{{ myBidsError() }}</p>
    }
  </form>

  @if (notice()) {
    <p class="notice">{{ notice() }}</p>
  }

  <app-product-grid [biddable]="true" [hideEnded]="true" (bid)="onBid($event)" />

  @if (bidTarget(); as target) {
    <app-bid-dialog [product]="target" (closed)="onBidClosed()" (placed)="onBidPlaced($event)" />
  }

  @if (myBidsPhone(); as phone) {
    <app-my-bids-dialog [phone]="phone" (closed)="onMyBidsClosed()" />
  }
</section>
