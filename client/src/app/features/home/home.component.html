<section class="auctions">
  <header class="auctions-head">
    <h1>Subastas en curso</h1>
    <p class="subtitle">Explora los productos disponibles y su puja inicial.</p>
  </header>

  @if (notice()) {
    <p class="notice">{{ notice() }}</p>
  }

  <div class="search-row">
    <app-auction-search
      [hideEnded]="true"
      (queryChange)="onFilterInput($event)"
      (selected)="onSearch($event)"
    />

    @if (filter().trim()) {
      <button type="button" class="clear-filter" (click)="clearFilter()">
        Limpiar búsqueda ({{ filter().trim() }})
      </button>
    }

    <label class="numbered-toggle">
      <input
        type="checkbox"
        [checked]="onlyNumbered()"
        (change)="onNumberedToggle($any($event.target).checked)"
      />
      <span class="toggle-switch" aria-hidden="true"></span>
      <span>Solo numeradas</span>
    </label>
  </div>

  <app-product-grid
    [biddable]="true"
    [hideEnded]="true"
    [onlyNumbered]="onlyNumbered()"
    [filter]="filter()"
    (bid)="onBid($event)"
  />

  @if (bidTarget(); as target) {
    <app-bid-dialog [product]="target" (closed)="onBidClosed()" (placed)="onBidPlaced($event)" />
  }
</section>
